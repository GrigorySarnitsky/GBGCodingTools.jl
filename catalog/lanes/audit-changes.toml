# /audit-changes lanes. Sources: IT audit.js (the kinds, checked[]/candidates_found, base) and PF audit.js
# (previously_worked, strength). Package specifics deleted: the guard symbols, the invariants text and the
# diffstat arrive in args. † anchors are constants (D18).

[[lane]]
key = "free-reader"
kind = "code"
anchor = false
brief = '''NO LIST. Read the diff and the current code and say what troubles you about these CHANGES. Every other lane in this panel works from a list of concerns somebody wrote down, and a list is a hypothesis about where the problems are. Do not work through a checklist; if you catch yourself doing so, go back to reading. The one thing you are held to is the panel's question — was each change justified, and did it silently alter behaviour for input that previously worked — not "what else is wrong with this package".'''

[[lane]]
key = "executing"
kind = "code"
anchor = true
brief = '''YOU RUN THINGS. Every other lane in this panel READS, and that is the flaw independent attackers on this design converged on: the instruments these edits came from are founded on "a static claim about code is a hypothesis; the only admissible evidence is a program that fails", and their audit was built entirely out of readers. So an edit justified by a MEASUREMENT written in a comment — "this allocates nothing", "bitwise-identical", "measured 1.9x", "0 bytes" — was certified by agents that read the comment.

Your job, in this order. (1) EVERY MEASUREMENT CLAIM the diff asserts, in a comment, a docstring or a commit message: re-run it. Write the Julia, run it, report the number you got beside the number claimed. (2) EVERY NEW ENTRY POINT the diff adds — a method, a keyword, an exported name, a changed return shape: write the call ITS OWN DOCUMENTATION describes and RUN it. A convenience method added in this window that throws on its documented call is a real class, found here before. (3) Any claim of the form "X and Y now agree", "the two branches coincide", "value unchanged": evaluate both sides and compare. Report numbers, not impressions. Use `julia --project` in the repository. The package's executable claims — its test gate and the audit files named in the arguments — have already been run by the CLI and their exit codes recorded; your job is the claims those files do not cover.'''

[[lane]]
key = "under-rejection"
kind = "code"
anchor = true
brief = '''THE STRICT DUAL OF over-rejection. That lane enumerates guards the diff ADDS and asks if any is too strict. Nobody else owns guards the diff REMOVES OR WEAKENS — and that is the direction that fails SILENTLY, since an over-strict guard throws in your face while a missing one returns a wrong number.

ENUMERATE, from the diff, every one of these that was deleted or loosened: a `throw`, an `@assert`, an early return, a ceiling or clamp, an equality test weakened to an inequality (`==` to `>=`), a concrete type annotation widened (to `Any`, to a supertype), a sentinel or floor removed, a conjunct dropped from a condition, a branch deleted. The package's named guard functions are the first place to look: {audit.guard_symbols}. For EACH, construct the input that USED to be refused and show what the package computes for it now. Note the quantifier trap that hides this class: input that previously threw was not "previously valid", so the behaviour-change lane excludes it by construction.'''

[[lane]]
key = "backend-portability"
kind = "code"
anchor = false
brief = '''CPU-IDENTICAL, DEVICE-BROKEN. Where the package's storage is generic `AbstractArray` and scalar indexing of a device array is forbidden, every test in the gate still runs on `Array`, so an edit can be bit-identical on CPU and broken on `CuArray`/`ROCArray` with nothing failing anywhere. No other lane owns this. (If the package has no device path, say so in `checked` and return CLEAN.)

For each edited line ask whether it would execute unchanged on a device array. Look for: scalar indexing introduced (`x[i]`, `first`, `getindex` in a loop); a host-only function called on field storage (an RNG fill, a `sort`, a `findfirst`); a closure capturing a non-bitstype (a `Type`, a `String`, an abstract field) which a kernel launch rejects; a new host-device transfer or readback in the hot path; `Float64` literals forcing a device kernel to double; anything reaching FFTW flags on a device path. Where the answer turns on which method a call dispatches to, say which package would have to provide it.'''

[[lane]]
key = "behaviour-change"
kind = "code"
anchor = true
brief = '''SILENT BEHAVIOUR CHANGE. For input that was valid and worked BEFORE these edits, does the package now compute a different number, take a different branch, or produce a different result? Trace each edit that touches a COMPUTATION — not a validation, a computation. Decide, per edit, whether an existing run's output changes and by how much if you can. Bitwise questions belong here: where the package asserts bitwise invariance (thread count, accumulation order) an edit that alters an association or a fused pass changes numbers even when it looks like a refactor. The field `previously_worked` is REQUIRED on every concern of this lane: name the concrete call or input that was valid before and now behaves differently — `yes`, `no`, or `unknown` when you cannot construct one; `unknown` is gated like `yes`.'''

[[lane]]
key = "over-rejection"
kind = "code"
anchor = true
brief = '''NEWLY REJECTED USAGE. ENUMERATE every argument validation the diff ADDS, then for EACH ask: was that input previously valid and useful for something legitimate? A validation that rejects a genuine workflow is a regression dressed as a safety improvement — refusing a zero parameter can foreclose a limiting study; refusing an empty seed can foreclose building a state incrementally. Judge each on whether a scientist could reasonably have been doing it; the package's stated rule is that an absence must encode mathematics or a decision, not convenience.'''

[[lane]]
key = "public-contract"
kind = "code"
anchor = false
brief = '''PUBLIC API AND CONTRACT. What changed in the surface a user depends on? Struct fields added or REMOVED, positional constructors whose arity changed, return values whose type changed, exports added or renamed, error types thrown where none were before, a default changed. For each, state whether existing user code would break, and whether the break is announced anywhere a reader would see it.'''

[[lane]]
key = "numerics"
kind = "code"
anchor = false
brief = '''NUMERICAL AND MATHEMATICAL CORRECTNESS of the changed lines. Do the edited formulas still compute what they claim? Check every changed normalization, bound, cutoff, index range, type of a constant (an exact Int/Rational versus a float), and every comparison that gates whether a value is served. Derive; do not assume the author's arithmetic.'''

[[lane]]
key = "invariants"
kind = "code"
anchor = false
brief = '''THE PACKAGE'S OWN INVARIANTS, which are numbered and binding. They are given to you here verbatim from the package's rulebook:

{audit.invariants}

Check each edit against them. Did any edit add an allocation, a reduction, or a device-to-host readback to a path the invariants say is allocation-free? Did any add resident storage, move work into a hot loop, relax a compatibility rule, or quietly widen a deliberate absence? An edit that quietly relaxes one of these is the finding; quote the invariant's number and the hunk.'''

[[lane]]
key = "claim-versus-edit"
kind = "code"
anchor = false
brief = '''CLAIM AGAINST EDIT — you ARE to read the claims (the commit messages of the audited range, supplied in the arguments) first, unlike the other lanes. For each commit-message claim, find the corresponding hunk in the diff and check that the edit does what the claim says, no more and no less. Flag: edits present in the diff that no claim mentions (drive-by changes); claims that describe an edit not actually present; and claims whose scope is narrower than the edit made. This lane exists because the author was simultaneously the finder, fixer and reporter.'''

[[lane]]
key = "contract-drift"
kind = "prose"
anchor = true
brief = '''A DOCSTRING IS A PROMISE. For every changed line of prose, check the promise against the CODE it describes — at HEAD for what the code does, and at the base commit for what the promise USED to be. Hunt the direction that hides: a claim edited to match behaviour that is itself wrong (the documentation bent to fit the code rather than the code fixed to fit the documentation), a caveat or warning deleted, a quantifier weakened ("always" to "usually", "exactly" to "approximately", "never" to "rarely"), a guarantee that lost a condition it depended on. Quote the code line that settles each.'''

[[lane]]
key = "sweep-completeness"
kind = "prose"
anchor = false
brief = '''AN INCOMPLETE SWEEP. When one instance of a thing is edited, the others usually need it too — a renamed argument, a changed default, a retired term, a formula corrected in one docstring and not its `f`/`f!` twin, a decision-log entry updated while the invariant list was not. The house rule is "a flagged instance is a sample of a class; fix the class, not the line", and it has been broken while written down. For every prose change in this diff, grep the whole corpus for the OTHER sites that state the same thing, and report the ones left behind. Never open .gbg/ or ~/.gbg/.'''

[[lane]]
key = "reader-consequence"
kind = "prose"
anchor = false
brief = '''WHAT DOES A READER NOW BELIEVE THAT IS FALSE? Read the changed prose as its audience would — a scientist who reads the API documentation and NOT the source. For each edit ask what they would now do, expect, or conclude, and whether the code supports it. Flag prose that is technically true and practically misleading, an example that no longer runs, a signature that drifted from the implementation, and any place the docs now describe an intention rather than a behaviour.'''
