# /check-docs lanes. Sources: IT lanes.js (the fan-out), PF check-docs.md (the family and cold-reader
# mechanism, the `?name` substrate rule), IT check-docs.md L58–74 (the operational-claims procedure).
# The SURFACE lanes are generated by the CLI from the config — one per non-empty surface key
# (rationale, pages, src, ext, literate, built-html), refined by `lanes_extra` — using `surface_brief`;
# the three CROSS lanes below are constants. Every lane runs at economy unless `anchor = true`.

[surface]
kind = "surface"
anchor = false
brief = '''RUN EACH CHECK AS A POSITIVE PROCEDURE: enumerate the items, then verify each one. A defect that is absent-by-omission — an unbound symbol, a false-but-plausible formula, an argument that is never documented — does not announce itself on a read-through, so passive reading is NOT a check. GROUND TRUTH is the package's `src/`: verify every claim against the code and quote the decisive line.

START WITH YOUR CLAIM CHECKLIST. Your lane section below names a file the CLI computed from your own surface: every CITED NUMBER and every EXIT-CODE CLAIM it found, with its file and line. These are the claims that read as true and are checked by nothing — a count that was right when it was written and has since moved, an exit code the verb no longer returns. Each one is a claim you MUST discharge: measure it against the code or the register and record the verdict in `claims_checked[]`, one entry per item, `verdict` one of `TRUE`, `FALSE` or `UNVERIFIABLE` with the evidence that settled it. A `FALSE` verdict is also a finding; a `TRUE` one is not. The checklist is not your surface and not your cap — it is the mechanical floor under the six checks, which you run over the whole surface afterwards. An item you leave out of `claims_checked[]` reads as an item you did not check.

The checks on your surface:
1. CORRECT — every formula, normalization constant, conservation or adjoint relation, complexity claim and quantifier (exact / all / never / bit-for-bit) true and precise, verified against the code or by derivation; free of CATEGORY/TYPE ERRORS (an object vs its representation, an operator vs its parameter, a rate vs its integral, a scalar vs the field it reduces). Type every object from the code.
2. SELF-CONTAINED — every symbol bound at first use (or on the notation page); every signature argument documented, enumerated FROM THE SIGNATURE (positional and keyword), each its own entry; a term of art explained or `@ref`-linked. The package's terms are {package.terms}.
3. NOTATION — one symbol per concept and one concept per symbol; the house glyphs as the rendered policy states them for this package; math variables symbolic, storage descriptive.
4. FORMATTED — math is LaTeX never backticks; every code identifier backticked never bare; no code name inside a math span; no formula split across a math/code boundary; the TeX idiom of the rendered policy `latex-idiom.md`.
5. CURRENT & COMPLETE — every claim matches the code's PRESENT state. A docstring that names only a SUBSET of what the code now provides is stale even if literally true; check each summary against the current exports and method set.
6. CITED — author-year consistent, matching the package's references entry (or the whole rationale document where it keeps no references heading); no inaccessible source.

OUTPUT: report only GENUINE findings, each with file:line, the decisive quote (<= 25 words) and a concrete fix. Do NOT report style preferences, and do NOT report things the rulebook explicitly permits — the package's deliberate absences are {package.deliberate_absences}.

ONE DEFECT PER CLASS, NEVER ONE PER SITE. When the same mistake recurs, report it ONCE and list EVERY site in `locations`. This is not a presentation preference: the fix pass is held to the class, and both verifiers grade a finding against every location it names, so a class reported as one finding closes only when all of its sites are fixed, while the same class split across five findings spends five of your budget, tells the verifier nothing the class did not, and lets a sweep close four while the fifth survives. If you cannot name the sites exhaustively, say so in the description and list those you found — a class with an incomplete location list is still one finding.

Your budget is {lane.cap} FINDINGS, counted in classes; `locations` is unbounded, so a class with forty sites costs one. Report `candidates_found`, the number of distinct CLASSES you weighed before the budget bound you — not the number of sites. If a surface is clean, return an empty findings list with a non-empty `checked[]` — that is a real and useful result; an empty `checked[]` reads as a dead lane.'''

[[lane]]
key = "one-home"
kind = "cross"
anchor = false
brief = '''YOUR LANE IS THE ONE CHECK NO PER-SURFACE AGENT CAN RUN, because its unit is a CLAIM rather than a file: one concept, one home. The package states the same thing in more than one place — a rule in `policy/` and the header of the scan that enforces it; a verb's behaviour in its docstring, in a guide page and in the rationale; a constant in a schema default, in a config comment and in the prose that cites it; a procedure in an instrument's protocol and in the CLI that runs it; an f / f! pair or a getter / setter pair sharing one formula. Enumerate the claims that HAVE more than one home, then for EACH ask two questions: do the copies agree, and is exactly one of them the home the others point at?

Report a claim whose copies DISAGREE (quote both, and say which is right against `src/`); a claim with NO home, where every copy restates it in full and none owns it, so the next edit moves one and leaves the rest; and a copy that has DRIFTED from its home — a stale number, a renamed identifier, a condition that gained a case in one place only.

WORK FROM THE CLAIM OUTWARD, NEVER FROM THE FILE INWARD: pick a claim, then SEARCH the corpus for its other homes and compare what you find. Reading files hoping to notice a repetition is precisely what fails here — a second home in a file you never opened is the whole defect this lane exists to find, and it is why no per-surface lane can run this check: each of them sees one home and has no way to learn that a second exists.'''

[[lane]]
key = "cold-reader"
kind = "cross"
anchor = false
brief = '''YOUR LANE IS CHECK 2's AUDIENCE HALF. You are a competent scientist in the package's field ({package.domain}), at home in Julia, NEW to this package, reading the exported docstrings as a REPL user meets them (`?name`), with the design docs withheld. SUBSTRATE RULE: read the MODULE docstring of each module (`?Module`) and EVERY method docstring of a generic, never one collapsed docstring — a reader sees all of them. Flag every symbol, term of art, or package concept used before it is defined or never defined anywhere — the package's terms are {package.terms}. HUNT ESPECIALLY ORDINARY ENGLISH WORDS CARRYING PACKAGE-SPECIFIC MEANINGS — a register, an advance, a record, something armed, a front door — because they read as plain prose and never trip an undefined-symbol check: you understand the English and silently supply the wrong referent. Your read is ORDERED: report where you FIRST meet a term, since a gloss on a later page does not close a bare use on an earlier one. VERIFY each finding against the source before reporting: a term may be defined on the module docstring or a sibling method you did not open.'''

[[lane]]
key = "operational-claims"
kind = "cross"
anchor = false
brief = '''YOUR LANE IS CHECK 1's OPERATIONAL HALF, over the docstring surface. The per-surface lanes verify CONTENT — formulas, factors, relations, quantifiers. A docstring also makes claims about what the call DOES, and those survived every content lane on a real corpus: a step described as "the CFL value" where the code takes the smallest of three bounds; a keyword bullet saying "no ceiling by default" beside a bound that is exactly one. Neither is a formula, so nothing looked at them. You are the only lane in any instrument that holds a docstring and its body together. Run this as its own positive procedure, docstring by docstring — READ THE BODY FIRST, write down in one sentence what it computes, mutates and returns, and only then discharge the docstring's claims against it:
- a stated DEFAULT that differs from the signature's;
- "THE" value where the body branches, or takes a minimum, a maximum, or a fallback;
- a documented ERROR the code does not throw, or a throw the docs never mention;
- an ORDERING or TIMING claim ("once per step", "after the call") checked against where the call actually sits;
- a claim of NO ALLOCATION, EXACTNESS, or PRESERVATION of a property, checked against the body;
- an ARGUMENT whose documented effect is not the effect the body gives it;
- a claim about what the code DOES NOT do — the hardest, since there is no line to quote and the check is to search for the thing whose absence is asserted.
Quote the docstring claim and the body line that contradicts it.'''
