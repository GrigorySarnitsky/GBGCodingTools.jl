# catalog/scans.toml — every deterministic scan (docs/ARCHITECTURE.md §12.B, verbatim). Columns: id ·
# rule · tier (hard = must be empty; triage = printed in full, never fails; "argcov_policy" = the ONE
# configurable tier) · surfaces (config keys; docs = rationale + pages + literate; all = docs + src + ext)
# · runner (julia = a function under src/Scans/ or Reflection; html = over the built site) · fixture
# (the defect classes in fixture/GBG Fixture/defects.toml; a must-hit and a clean twin each).
# `gbg selftest` fails when a scan function is unregistered here or a registered scan has no fixture pair.
# `rule` is ONE canonical rule per scan, which is what the ledger and the doctor resolve against. A scan
# may enforce more than one — SCAN.DOI_CROSSCHECK enforces
# two — and the full list per scan is §12.B's table; the other direction, every scan enforcing a given
# rule, is that rule's `check` array in policy/RULES.toml. Read either of those, never this column, for
# "which rules does this scan carry".

[[scan]]
id = "SCAN.LINK_UNIFORMITY"
rule = "RULE.DOC.LINKS"
tier = "hard"
surfaces = ["src"]
runner = "julia"
fixture = ["mixed-link-run"]

[[scan]]
id = "SCAN.RETIRED_CLAIMS"
rule = "RULE.DOC.CURRENT"
tier = "hard"
surfaces = ["all", "data"]
runner = "julia"
fixture = ["retired-claim"]

[[scan]]
id = "SCAN.PROSE_SHAPE"
rule = "RULE.DOC.SHAPE"
tier = "hard"
surfaces = ["src", "rationale", "pages"]
runner = "julia"
fixture = ["paragraph-over-cap", "fields-not-last"]

[[scan]]
id = "SCAN.DOI_CROSSCHECK"
rule = "RULE.CIT.FULL_INLINE"
tier = "hard"
surfaces = ["src"]
runner = "julia"
fixture = ["doi-missing", "prose-reference"]

[[scan]]
id = "SCAN.SIGNATURE_FIDELITY"
rule = "RULE.DOC.SIGNATURE_FIDELITY"
tier = "triage"
surfaces = ["src"]
runner = "julia"
fixture = ["stale-keyword"]

[[scan]]
id = "SCAN.XLINK"
rule = "RULE.DOC.XLINK"
tier = "triage"
surfaces = ["src"]
runner = "julia"
fixture = ["unlinked-cross-module"]

[[scan]]
id = "SCAN.ID_RESOLVES"
rule = "RULE.DOC.CURRENT"
tier = "triage"
surfaces = ["all", "data"]
runner = "julia"
fixture = ["dead-rule-id"]
