# .gbg/config.toml — GBGFixture.  Schema: schema/config.schema.json in the pinned tool (closed keys: an
# unknown key, a missing required key, an unknown enum member or a path that does not exist is exit 2).
# Written by `gbg init` on 2026-09-09 from the package tree; every default is materialised, nothing is
# layered on top of this file. A `TODO` value is a fact the tree could not supply — `gbg doctor`
# (CFG.SURFACES, CFG.HATS) reports it until it is written.

[tool]
schema = 1
version = "dev"

[package]
deliberate_absences = ["no higher dimensions", "no time stepping"]
description = "The toy consumer of GBGCodingTools: a grid, a value field, two reductions and an options record, documented to the shared rubric."
docs_build = "julia --project=docs docs/make.jl"
docs_post = []
domain = "toy numerics"
extensions = []
julia_test = "julia --project -e 'using Pkg; Pkg.test()'"
modules = ["FixtureA", "FixtureB", "FixtureC"]
name = "GBGFixture"
rulebook_sections = ["CLAUDE.md#Core invariants", "docs/ARCHITECTURE.md#3. Decision log"]
terms = ["grid", "node", "field", "spacing"]

[paths]
examples = "examples"

[git]
branch = "master"

[surfaces]
built_html = "docs/build"
ext = []
glossary = "docs/src/notation.md"
history_exempt = "docs/ARCHITECTURE.md#3. Decision log"
literate = ["examples/scaling.jl"]
pages = ["docs/src/**/*.md"]
rationale = ["docs/ARCHITECTURE.md"]
references_heading = "docs/ARCHITECTURE.md#References"
src = ["src/*.jl"]

    [surfaces.generated]
    globs = []
    optional = true

[docs]
admonition_titles = "always"
doctest = true
unexported_base_expected = []

    [[docs.retired_claims]]
    pattern = "factor\\s+one\\s+third\\s+is\\s+used"
    reason = "decision 1 — the energy convention is one half"

[rubric]
leading_identity = "physical-meaning"

[notation]
mathbf_allowed = ["\\mathbf{1}"]
vectors = "component"

[citations]
require_doi = true

# The [instruments] section stood here until 2026-09-17 (see the tool's own config).

[cost]
default = "economy"

[schema]
finding_types_extra = []

[scans]
custom = []
