# defects.toml — the planted defect classes of the fixture (ARCHITECTURE §8): one [[defect]] per scan of
# catalog/scans.toml, naming the class, the scan that must hit, the surface file under defects/ (scanned
# by the self-tests through a derived config) and a fragment the hit's text must contain; and one
# [[clean]] per class naming a twin in the clean corpus the scan must NOT hit. The HTML classes name a
# directory under defects/html/ standing in for a built site.

[[defect]]
class = "bare-sibling"
scan = "SCAN.SIBLING_LINK"
file = "defects/page.md"
fragment = "GBGPeriodicFields"
[[defect]]
class = "linked-later-mention"
scan = "SCAN.SIBLING_LINK"
file = "defects/page.md"
fragment = "later mention of `GBGIsotropicTurbulence`"
[[defect]]
class = "mathbf-banned"
scan = "SCAN.MATHBF"
file = "defects/Defects.jl"
fragment = "mathbf{u}"
[[defect]]
class = "mixed-link-run"
scan = "SCAN.LINK_UNIFORMITY"
file = "defects/Defects.jl"
fragment = "mixed_link_run"
[[defect]]
class = "retired-claim"
scan = "SCAN.RETIRED_CLAIMS"
file = "defects/Defects.jl"
fragment = "factor one third is used"
[[defect]]
class = "paragraph-over-cap"
scan = "SCAN.PROSE_SHAPE"
file = "defects/Defects.jl"
fragment = "paragraph_over_cap"
[[defect]]
class = "fields-not-last"
scan = "SCAN.PROSE_SHAPE"
file = "defects/Defects.jl"
fragment = "# Fields"
[[defect]]
class = "doi-missing"
scan = "SCAN.DOI_CROSSCHECK"
file = "defects/Defects.jl"
fragment = "10.9999/never-listed"
[[defect]]
class = "prose-reference"
scan = "SCAN.DOI_CROSSCHECK"
file = "defects/Defects.jl"
fragment = "a full reference in the prose"
[[defect]]
class = "stale-keyword"
scan = "SCAN.SIGNATURE_FIDELITY"
file = "defects/Defects.jl"
fragment = "stale"
[[defect]]
class = "unlinked-cross-module"
scan = "SCAN.XLINK"
file = "defects/Defects.jl"
fragment = "mean_value"
[[defect]]
class = "emphasis-survives"
scan = "SCAN.HTML_RENDERED_MARKUP"
file = "defects/html/emphasis-survives"
fragment = "*marker"
[[defect]]
class = "stray-math"
scan = "SCAN.HTML_STRAY_MATH"
file = "defects/html/stray-math"
fragment = "lpnorm"
[[defect]]
class = "docstring-twice"
scan = "SCAN.HTML_DOCSTRING_ONCE"
file = "defects/html/docstring-twice"
fragment = "2 pages"
[[defect]]
class = "unhomed-export"
scan = "SCAN.HTML_PUBLIC_HOME"
file = "defects/html/unhomed-export"
fragment = "mean_value"
[[defect]]
class = "base-leak"
scan = "SCAN.HTML_BASE_LEAK"
file = "defects/html/base-leak"
fragment = "Base.copy"

# Clean twins: the scan must report nothing on these (the clean corpus, or the clean HTML site).
[[clean]]
scan = "SCAN.SIBLING_LINK"
file = "docs/src/index.md"
[[clean]]
scan = "SCAN.MATHBF"
file = "docs/ARCHITECTURE.md"
[[clean]]
scan = "SCAN.LINK_UNIFORMITY"
file = "src/FixtureA.jl"
[[clean]]
scan = "SCAN.RETIRED_CLAIMS"
file = "docs/ARCHITECTURE.md"
[[clean]]
scan = "SCAN.DOI_CROSSCHECK"
file = "src/FixtureB.jl"
[[clean]]
scan = "SCAN.DOI_CROSSCHECK"
file = "src/FixtureC.jl"
[[clean]]
scan = "SCAN.HTML_RENDERED_MARKUP"
file = "defects/html/clean"
[[clean]]
scan = "SCAN.HTML_STRAY_MATH"
file = "defects/html/clean"
[[clean]]
scan = "SCAN.HTML_DOCSTRING_ONCE"
file = "defects/html/clean"
[[clean]]
scan = "SCAN.HTML_PUBLIC_HOME"
file = "defects/html/clean"
[[clean]]
scan = "SCAN.HTML_BASE_LEAK"
file = "defects/html/clean"
[[defect]]
class = "dead-rule-id"
scan = "SCAN.ID_RESOLVES"
file = "defects/Defects.jl"
fragment = "RULE.DOC.NOSUCHRULE"
[[clean]]
scan = "SCAN.ID_RESOLVES"
file = "src/FixtureB.jl"
