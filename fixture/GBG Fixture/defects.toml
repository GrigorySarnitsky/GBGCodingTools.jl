# defects.toml — the planted defect classes of the fixture (ARCHITECTURE §8): one [[defect]] per scan of
# catalog/scans.toml, naming the class, the scan that must hit, the surface file under defects/ (scanned
# by the self-tests through a derived config) and a fragment the hit's text must contain; and one
# [[clean]] per class naming a twin in the clean corpus the scan must NOT hit. The HTML classes name a
# directory under defects/html/ standing in for a built site.

[[defect]]
class = "doi-missing"
scan = "SCAN.DOI_CROSSCHECK"
file = "defects/Defects.jl"
fragment = "10.9999/never-listed"
[[defect]]
class = "prose-reference"
scan = "SCAN.DOI_CROSSCHECK"
file = "defects/Defects.jl"
fragment = "a full reference in the prose"
[[clean]]
scan = "SCAN.DOI_CROSSCHECK"
file = "src/FixtureB.jl"
[[clean]]
scan = "SCAN.DOI_CROSSCHECK"
file = "src/FixtureC.jl"
