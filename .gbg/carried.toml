round = "2026-09-12-check-docs-01"
type = "operational"
description = "lanes.js, panel.js and audit.js each define their own JSON Schema constraining the structured object an agent returns per finding; in all three, title/description are plain strings with no minLength and locations has no minItems. But schema/finding.schema.json — the exact shape `gbg round bank` checks every finding against (Rounds.jl:580-586, refusing the bank with exit 2 on the first mismatch, 'after the whole panel and every witness have already been paid for') — requires title minLength 8, description minLength 20, and locations minItems 1. An agent can return a schema-valid finding under the launching script's own SCHEMA that the round's bank step then refuses — discovered only at the most expensive possible point."
