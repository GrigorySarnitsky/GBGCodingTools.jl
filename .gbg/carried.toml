id = "2026-09-11-check-docs-01/cold-reader#1"
title = "\"act verifier\" / \"state verifier\" and the HONORED/LINE-ONLY verdict vocabulary are used with no definition anywhere in the source"
round = "2026-09-11-check-docs-01"
type = "self-containment"
description = "A cold reader meets `?GBGCodingTools.demote` (Demote.jl is included right after Doctor.jl, well before Passes.jl) and is immediately handed four unglossed terms of art at once: \"act verdict\", \"the act verifier\" (vs. \"the state verifier\", elsewhere called \"the blind verifier\" — three names for what turn out to be two roles), \"class_surfaces\", and \"swept\". None is a plain-English read: an \"act verifier\" does not mean a verifier that acts, and \"swept\" here means specifically \"a location a finding names that the fix pass's diff touched\" (RULE.DOC.CLASS_SWEEP's sense), not the ordinary sense used two lines earlier in Reflection.jl (\"whose `src` surface names the files swept\", meaning merely \"read\"). The closed verdict vocabulary itself — `HONORED`, `LINE-ONLY`, and later `PHANTOM`/`UNFIXED`/`ABSENT`/`NOT-A-DEFECT` (Witnesses.jl, Passes.jl) — is never enumerated or explained as a vocabulary anywhere a `?name` lookup would land; each docstring just uses the members as already-known constants. I verified this is not merely a link I missed: I grepped the whole `src/` and `ext/` tree for \"act verifier\", \"state verifier\", \"blind verifier\", \"class_surfaces\", \"HONORED\", \"LINE-ONLY\" and every occurrence is inside a docstring or comment that USES the term, none DEFINES it (the closest thing to a definition, RULE.INST.SELF_REPORT's \"the act verifier sees the diff, the state verifier is blind\", lives only in the policy rulebook, which a `?name` REPL read never surfaces). By contrast, every other overloaded-but-central term in this package (`consumer`, `instrument`, `round`, `lane`, `hat`, `gate`, the three senses of `anchor`, `surface`, `managed file`, DEAD/REJECTED/EMPTY/TRUNCATED lane statuses) gets exactly this kind of module-docstring or first-use definition elsewhere in the same corpus, which is what makes its absence here conspicuous rather than a house style."
