# .gbg/seeds.toml — this package's seed catalogue (ARCHITECTURE §6.4). A /check-consistency round plants
# these into the manuscript the hats read, so an EMPTY hat is falsifiable: a hat that reports nothing on a
# substrate carrying a planted defect is SUSPECT, and recall per class is measurable. `anchor` is a regex
# over the FULL manuscript, `replacement` the mutated text, `occurrence` the base 1-based occurrence the
# per-round salt offsets. Nothing here is ever fixed in the corpus and no seed enters the ledger.

[[class]]
name = "exit-code-drift"
description = "the exit contract corrupted at one site: 2 (cannot evaluate) restated as a finding"
anchor = '2 cannot evaluate'
replacement = '2 a second finding'
occurrence = 1

[[class]]
name = "count-drift"
description = "a stated count moved away from the table it cites"
anchor = '49 read-only checks'
replacement = '47 read-only checks'
occurrence = 1

[[class]]
name = "quantifier"
description = "a universal weakened to a false near-universal"
anchor = 'every consumer'
replacement = 'almost every consumer'
occurrence = 2

[[class]]
name = "inverted-rule"
description = "a rule stated backwards at one site"
anchor = 'never by re-running the battery'
replacement = 'by re-running the battery'
occurrence = 1

[[class]]
name = "false-mechanism"
description = "a mechanism attributed to the wrong artefact"
anchor = 'the Stop hook'
replacement = 'the docs build'
occurrence = 1

[[class]]
name = "vocabulary-collision"
description = "a term of art replaced by a plausible synonym that means something else here"
anchor = 'pinned version'
replacement = 'installed version'
occurrence = 2
