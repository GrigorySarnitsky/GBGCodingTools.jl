target        = "2026-09-10-check-docs-03/pages#2"
reason        = "index.md's oracle-engine sentence is fixed and the pass-3 blind state verifier read it ABSENT; the act verifier grades it UNDONE only because the fix landed in an earlier fix range of this same round and its range starts at the last graded pass, so honored closure is unreachable however sound the fix"
