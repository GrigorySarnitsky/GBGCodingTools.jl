# .gbg/exemptions.toml — the one ledger (ARCHITECTURE §7.2). One [[exemption]] per waiver or adjudication:
# id (a RULE.* rule, a SCAN.* scan, a doctor check, a finding id <round>/<lane>#<n>, or a harness op),
# scope (policy | scan | lint | check | finding | harness), target, reason (≥ 40 characters), recorded,
# and expires (≤ recorded + 365 d) — or overturn_when instead of expires on scope finding. An optional
# [exemption.match] table (arg_name, arg_type, path, symbol) REFINES a scan|lint|policy|harness entry.
# Empty until a rule needs a reason here; `gbg doctor` validates every entry (CFG.EXEMPTIONS).

# Declared 2026-09-09 after the self-application sweep: four testing rules whose SUBJECT does not exist in
# this package. It has no numerical operations, no arrays, no in-place operators over element storage and
# no exported public surface, so the harness engines that measure those measure nothing here. Recording
# them makes the gap visible in `gbg doctor` and in the rendered deviations page, instead of showing as
# engines that are simply never called. Each is reviewed at expiry, not renewed silently.

# The owner narrowed RULE.DOC.SIGNATURE_MIRROR on 2026-09-12 (451 arguments over 247 docstrings read the
# house way, 4 the other), which settles the finding carried for it: the docstring form ext#1 asked for is
# now the one the rule forbids.
[[exemption]]
id       = "2026-09-11-check-docs-02/ext#1"
scope    = "finding"
target   = "2026-09-11-check-docs-02/ext#1"
ruling   = "not-a-defect"
reason   = "the finding asked gate_or_skip's docstring to repeat `what::AbstractString` from the method, under the rule as it then read; the owner narrowed RULE.DOC.SIGNATURE_MIRROR on 2026-09-12 so a signature shows names and defaults and never types, and the docstring is now correct without it"
recorded = 2026-09-12
overturn_when = "RULE.DOC.SIGNATURE_MIRROR is widened again to require the method's types in the signature line"
evidence = "policy/docs-rubric.md RULE.DOC.SIGNATURE_MIRROR; SCAN.SIGNATURE_TYPED enforces the narrowed form"

[[exemption]]
id       = "RULE.TEST.ALLOC_ZERO"
scope    = "policy"
target   = "*"
reason   = "no in-place operator over element storage exists here: this package's `!` functions mutate a registry, a dictionary or a string buffer, and an allocation bound on them measures the Julia runtime, not the package"
recorded = 2026-09-09
expires  = 2027-09-09
evidence = "src/TestHarness.jl @alloc_below and allocation_completeness have no call site outside the fixture"

[[exemption]]
id       = "RULE.TEST.PASS_AUDIT"
scope    = "policy"
target   = "*"
reason   = "the traffic audit counts reads and writes per array element; this package holds no array whose traffic is a correctness property, so a frozen row would record the runtime's behaviour and nothing of the package's"
recorded = 2026-09-09
expires  = 2027-09-09
evidence = "src/TestHarness.jl CountingArray, Traffic and audit have no call site outside the fixture"

[[exemption]]
id       = "RULE.TEST.EXAMPLES_RUN"
scope    = "policy"
target   = "*"
reason   = "this package ships no Literate examples: its `literate` surface is empty by design, since a worked example of a review instrument is a round, which is recorded under .gbg/rounds/ rather than executed as a script"
recorded = 2026-09-09
expires  = 2027-09-09
evidence = ".gbg/config.toml surfaces.literate = []"

[[exemption]]
id       = "RULE.DOC.LEADING_IDENTITY"
scope    = "policy"
target   = "*"
reason   = "the leading identity of a docstring is the physical meaning of the quantity it computes; this package computes no physical quantity, so its docstrings lead with what the operation does, which the rubric's own parameterisation already admits"
recorded = 2026-09-09
expires  = 2027-09-09
evidence = "rubric.leading_identity is a declared variation point (ARCHITECTURE §5.5)"

[[exemption]]
id       = "RULE.API.POSITIONAL"
scope    = "policy"
target   = "*"
reason   = "no program decides whether an argument affects the result: the rule is semantic, so no scan or doctor check can exist for it. Its `check` in RULES.toml is `panel` — decided by a reading panel inside an instrument that runs, which under `RULE.TEST.RULE_WITH_CHECK` is an answer and not the unpaid debt `weakness` names"
recorded = 2026-09-09
expires  = 2027-09-09
evidence = "the self-application sweep of 2026-09-09 found no scan, doctor check or test enforcing it"

# Adjudicated 2026-09-09 at the close of round 2026-09-09-check-docs-02. The act verifier called the
# last fix LAUNDERED and was right: the seed filter's behaviour is unchanged, and only the prose moved.
# The finding is real, and what it exposes is larger than itself, so it is recorded rather than papered
# over. Its remedy is an instrument change and a closed-vocabulary change, neither of which belongs in a
# fix pass; it is carried in the round's deferred.md and on the roadmap.

[[exemption]]
id            = "2026-09-09-check-docs-02/operational-claims#10"
scope         = "finding"
target        = "2026-09-09-check-docs-02/operational-claims#10"
reason        = "the finding is right that `substrate` promises a narrowed corpus and the seed filter honours only `siteonly`. The delivery honours only `siteonly` too: panel.js splits the manuscript once and hands `rawhtml`, `docstrings`, `rulebook` and `none` the same full text a `full` hat gets. Narrowing the seed set by a name that narrows nothing would mark a hat blind to seeds it was handed, hiding the failure suspect_hats exists to catch, so the filter follows the delivery and says so"
recorded      = 2026-09-09
overturn_when = "panel.js delivers a corpus narrowed per substrate, or the substrate vocabulary drops the four values that narrow nothing — either makes the seed filter's siteonly-only rule wrong"
evidence      = "src/CLI/Recall.jl; instruments/check-consistency/workflow/panel.js:60,82 branch on `siteonly` alone, and Preflight.render_args hands every hat the same {full, siteonly} manuscripts"

# Adjudicated 2026-09-10 at pass 12 of round 2026-09-09-check-docs-02. The act verifier called the fix
# LAUNDERED and was right about the diff: only the schema's description moved. The state verifier read
# the code and found no defect to fix — the two floors are deliberate and they are not the same floor.
# Recorded here rather than closed by another prose edit.

[[exemption]]
id            = "2026-09-09-check-docs-02/schemas#4"
scope         = "finding"
target        = "2026-09-09-check-docs-02/schemas#4"
reason        = "the schema's floor and the doctor's are different instruments, not a gap to close. `Ledger.read` THROWS on any schema failure and is called by sync, every scan, the doctor and the docs build, so a schema floor refuses only a reason that is no reason at all — raising it to 40 would take the whole tool down over a short sentence in a consumer's ledger. CFG.EXEMPTIONS is where the real bound of 40 characters per entry belongs: it names the entry, keeps working, and the session fixes it"
recorded      = 2026-09-10
overturn_when = "Ledger.read stops throwing on a schema failure and names the entry instead, which would make one floor able to do both jobs"
evidence      = "src/CLI/Ledger.jl:35-36 throws LedgerError on validation failure; src/CLI/Doctor.jl:308 enforces >= 40 per entry and reports it as a check"
