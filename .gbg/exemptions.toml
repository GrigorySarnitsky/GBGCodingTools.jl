evidence      = "src/CLI/Ledger.jl:35-36 throws LedgerError on validation failure; src/CLI/Doctor.jl:308 enforces >= 40 per entry and reports it as a check"

# Adjudicated 2026-09-10, at the close of 2026-09-10-check-docs-03's third pass. THE DEFECT IS GONE in
# every one of the sixteen: the blind state verifier, reading the corpus with no sight of any diff,
# returned ABSENT for each in pass 3 (verdicts/pass-3/state/). What the loop cannot do is CLOSE them.
# `Passes.pass_scope` hands the act verifier only the newest fix range — the last GRADED pass's head to
# this pass's head — and the act verifier's own definition of UNDONE is "nothing in the diff addresses
# this finding". A fix made in pass 1 and re-checked in pass 3, because pass 2 happened to touch a file
# the finding names, is therefore graded UNDONE however sound it is; and `grade` closes only on act
# HONORED plus a favourable state. No further fix pass can reach these: there is nothing left to fix,
# so no later range can ever contain a change addressing them.
#
# The instrument fix — give the act verifier every fix range since the finding was banked, or let a
# re-checked CLOSED id be graded on regression rather than on this diff's contribution — is an
# instrument change, hence its own commit and its own release, and is recorded as a deferral of this
# round (rounds/2026-09-10-check-docs-03/deferred.md, carried into .claude/WORK_QUEUE.md). Until it
# ships, this is the honest closure: the work was done, the verifier confirms it, the arithmetic cannot.

