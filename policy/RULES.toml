# policy/RULES.toml — the rule register: every RULE.* id with its policy file, its section heading, its
# one-line statement (ARCHITECTURE §12.A), its sentinel — the first sentence of the rule's paragraph,
# verbatim — and its `check`: what catches the rule's next violation (RULE.TEST.RULE_WITH_CHECK), one or
# more of `scan:<id>`, `doctor:<id>`, `test:<path>`, `harness:<binding>`, `panel` (a reading panel decides
# it inside an instrument that runs) or `weakness` (no check, however settled the habit).
# LEG.SENTINELS (doctor) fails when a sentinel is absent from its file; the tool's own test
# suite (test/schemas.jl) fails when a heading exists without a row or a row without a heading, and when
# a sentinel is not a verbatim run of its paragraph. Regenerated from policy/*.md by
# `gbgdev rules` (Phase 1) whenever a rule paragraph changes; edit the paragraph, not this file.

[[rule]]
id = "RULE.DOC.TWO_TIER"
file = "docs-rubric.md"
section = "### RULE.DOC.TWO_TIER"
statement = "A module docstring is a map (linked one-liners, no formulas); a function docstring is a home."
sentinel = "A module docstring is a map and a function docstring is a home."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.HOME_ORDER"
file = "docs-rubric.md"
section = "### RULE.DOC.HOME_ORDER"
statement = "A function docstring is ordered: identity, when-to-use, arguments, one formula, citation, links, caveats, then `# References`, then `# Fields` last; internals, jargon and rationale are excluded."
sentinel = "A function docstring is ordered: identity, when-to-use, arguments, one formula, citation, links, caveats."
check = ["rule:RULE.DOC.HOME_ORDER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.LEADING_IDENTITY"
file = "docs-rubric.md"
section = "### RULE.DOC.LEADING_IDENTITY"
statement = "Item (1) is a plain one-sentence identity, physical-meaning first or estimand first (rubric.leading_identity)."
sentinel = "Item (1) of the home is a plain one-sentence identity that leads with what the operation means, not how it is computed."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.ONE_HOME"
file = "docs-rubric.md"
section = "### RULE.DOC.ONE_HOME"
statement = "One concept, one home: one docstring per operation on the bare binding; the ! form owns the formula and is listed first; every other variant is a thin wrapper that @ref-links the home and carries no second formula."
sentinel = "One concept has one home: one docstring per operation, on the bare binding, and a generic carries one docstring, never one per method."
check = ["rule:RULE.DOC.HOME_ORDER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.VARIANT_PAIR"
file = "docs-rubric.md"
section = "### RULE.DOC.VARIANT_PAIR"
statement = "Across an f/f! or getter/setter pair the defining math appears once; the wrapper carries no display formula (the review unit is the variant set)."
sentinel = "The review unit is the operation's whole variant set, so the defining math appears once across an `f`/`f!` or getter/setter pair and the wrapper carries no display formula."
check = ["rule:RULE.DOC.HOME_ORDER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.ARGS_FORM"
file = "docs-rubric.md"
section = "### RULE.DOC.ARGS_FORM"
statement = "Three or more arguments, or any keyword, use the bulleted form led by 'The arguments are:'; fewer are bound in prose; never mixed; a thin wrapper and an internal _ helper are exempt (the threshold 3 is a constant)."
sentinel = "A docstring documenting three or more arguments, or any keyword argument, uses the bulleted form led by `The arguments are:`; with fewer, the arguments are bound in running prose, and the two forms are never mixed in one docstring."
check = ["rule:RULE.DOC.ARGS_FORM"]  # converted 2026-09-17: src/Rules/arguments.jl
[[rule]]
id = "RULE.DOC.FIELDS"
file = "docs-rubric.md"
section = "### RULE.DOC.FIELDS"
statement = "A type with named, user-readable fields documents them under 'The fields are', one bullet per field, every bullet a real field and every field a bullet."
sentinel = "A type that stores named, user-readable fields documents them under `The fields are`, one bullet per field, every bullet a real field and every field a bullet; prose is reserved for the one-sentence identity above the list."
check = ["rule:RULE.DOC.FIELDS"]  # converted 2026-09-17: src/Rules/docstrings.jl
[[rule]]
id = "RULE.DOC.ADMONITION_TITLE"
file = "docs-rubric.md"
section = "### RULE.DOC.ADMONITION_TITLE"
statement = "Every !!! block carries a custom descriptive title (docs.admonition_titles: always, or load-bearing only)."
sentinel = "An admonition title is plain text stating the caveat, so a reader skimming the page learns the hazard without opening the block."
check = ["rule:RULE.DOC.HOME_ORDER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.STEER"
file = "docs-rubric.md"
section = "### RULE.DOC.STEER"
statement = "Every ! form with an allocating sibling carries the verbatim in-place steer sentence, naming its own destination argument."
sentinel = "Every `!` form that has an allocating sibling carries the in-place steer sentence verbatim, after the identity paragraph and before the arguments, naming its own destination argument."
check = ["rule:RULE.DOC.HOME_ORDER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.ALIASING_BULLET"
file = "docs-rubric.md"
section = "### RULE.DOC.ALIASING_BULLET"
statement = "An operation-specific aliasing statement lives in the destination bullet; the package-wide guarantee lives in the module docstring."
sentinel = "An operation-specific statement of whether the destination may alias an input lives in the destination argument's bullet, not as standalone prose."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.INTERNAL_API"
file = "docs-rubric.md"
section = "### RULE.DOC.INTERNAL_API"
statement = "An '## Internal API' section splits into '### Types'/'### Functions' only when it holds both, comes last, and opens with the disclaimer sentence."
sentinel = "An `## Internal API` section splits into `### Types` and `### Functions` only when it holds both kinds, comes last on its page, and opens with the same disclaimer sentence."
check = ["scan:SCAN.API_PAGE_STRUCTURE"]
[[rule]]
id = "RULE.DOC.REF_ABUT"
file = "docs-rubric.md"
section = "### RULE.DOC.REF_ABUT"
statement = "A @ref never abuts a second code span; the whole call is the link text."
sentinel = "A `@ref` never abuts a second code span, because two adjacent monospace chips render with a visible seam."
check = ["rule:RULE.DOC.REF_ABUT"]  # converted 2026-09-17: src/Rules/rendering.jl
# SCAN.API_PAGE_STRUCTURE's canonical rule is RULE.DOC.INTERNAL_API; it carries this rule's `@index` and
# empty-block halves and reads the `pages` surface only. A policy waiver resolves against a scan's
# canonical rule alone, so a waiver of THIS rule does not reach that scan, which keeps running and says so
# on its report line, in CFG.EXEMPTIONS (a WARN) and in deviations.md (Scan.apply_ledger).
[[rule]]
id = "RULE.DOC.API_GROUPING"
file = "docs-rubric.md"
section = "### RULE.DOC.API_GROUPING"
statement = "API pages are math-grouped under hand-written headers via @docs; each object once; f/f! together, ! first; no @index; no empty @docs block; every public operation on a public page."
sentinel = "API pages are math-grouped under hand-written headers via explicit `@docs` blocks, each object once, an `f`/`f!` pair together with the `!` home first, no `@index`, and no empty block."
check = ["scan:SCAN.API_PAGE_STRUCTURE", "scan:SCAN.HTML_DOCSTRING_ONCE", "scan:SCAN.HTML_PUBLIC_HOME", "scan:SCAN.HTML_BASE_LEAK"]
[[rule]]
id = "RULE.DOC.COVERAGE_BASES"
file = "docs-rubric.md"
section = "### RULE.DOC.COVERAGE_BASES"
statement = "A measure reduction documents every base it supports."
sentinel = "A reduction documents every base it supports, not just one."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.GRAMMAR"
file = "docs-rubric.md"
section = "### RULE.DOC.GRAMMAR"
statement = "Every sentence has a subject and a verb; concise means few words, not missing verbs."
sentinel = "Every sentence has a subject and a verb; no verbless fragments, noun stacks, `label:` colon tags or comma splices."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.SENTENCE_OPENER"
file = "docs-rubric.md"
section = "### RULE.DOC.SENTENCE_OPENER"
statement = "A sentence opens with a capitalized ordinary word, never a lowercase identifier or a formula; bullets, comments, headings and fenced code are exempt."
sentinel = "A sentence opens with a capitalized ordinary word, never a lowercase code identifier or a math formula."
check = ["rule:RULE.DOC.SENTENCE_OPENER"]  # converted 2026-09-17: src/Rules/docstrings.jl
[[rule]]
id = "RULE.DOC.VERIFIED"
