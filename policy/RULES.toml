sentinel = "The first mention of a sibling GBG package in a page, a rationale document, a Literate example or a docstring is a link to that package's documentation site, written `[`Package`](https://<owner>.github.io/Package.jl/)`."
check = ["scan:SCAN.SIBLING_LINK"]
