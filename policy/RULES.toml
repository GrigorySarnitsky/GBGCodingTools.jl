sentinel = "A rationale document reads top to bottom without another file: every piece of notation, a math symbol or a code identifier, is introduced in plain language at its first use."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.TERMS_DEFINED"
file = "docs-rubric.md"
section = "### RULE.DOC.TERMS_DEFINED"
statement = "A term of art is defined in a clause or @ref-linked on first use; the acceptance test is the cold read."
sentinel = "A term of art naming a package concept is defined in a clause or `@ref`-linked on its first use, and the acceptance test is the cold read."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.CURRENT"
