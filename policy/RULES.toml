check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
id = "RULE.DOC.SELF_CONTAINED"
file = "docs-rubric.md"
section = "### RULE.DOC.SELF_CONTAINED"
