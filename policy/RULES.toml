sentinel = "A flagged instance is a sample of a class: characterize the class, sweep every surface for it, and fix all occurrences in one pass, reporting the class and the count."
check = ["rule:RULE.DOC.TWO_TIER"]  # converted 2026-09-17: a value with its reason, no program check
[[rule]]
